
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanwuya-lab3-7-dev-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanwuya-lab3-7-dev
  template:
    metadata:
      labels:
        app: sanwuya-lab3-7-dev
    spec:
      containers:
        - name: nginx
          image: cithit/sanwuya:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: sanwuya-lab3-7-dev-service
spec:
  type: ClusterIP
  selector:
    app: sanwuya-lab3-7-dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sanwuya-lab3-7-dev-ingress
spec:
  rules:
    - http:
        paths:
          - path: /lab3-7
            pathType: Prefix
            backend:
              service:
                name: sanwuya-lab3-7-dev-service
                port:
                  number: 80
